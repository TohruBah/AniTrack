<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AniTrack</title><link rel="stylesheet" href="/style.css"></head><body><main><header><p>SEU CATÁLOGO PESSOAL</p><h1>AniTrack</h1><span>Organize seus animes e acompanhe seu progresso.</span></header><section><h2>Adicionar anime</h2><form id="form"><label>Título<input name="title" maxlength="100" required></label><label>Total de episódios<input name="totalEpisodes" type="number" min="1" value="12"></label><label>Assistidos<input name="watchedEpisodes" type="number" min="0" value="0"></label><label>Status<select name="status"><option>Planejado</option><option>Assistindo</option><option>Pausado</option><option>Concluído</option></select></label><button>Adicionar</button><p id="message"></p></form></section><section><h2>Meu catálogo</h2><div id="list"></div></section></main><script src="/app.js"></script></body></html>
